name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake make zlib1g-dev libfuse2t64 wget
      - name: Build CryptoPP
        run: |
          make -C externals/cryptopp -j"$(nproc)" libcryptopp.a
          mkdir -p extractor/build/cryptopp/cryptopp
          cp externals/cryptopp/libcryptopp.a extractor/build/cryptopp/cryptopp/
      - name: Build depkg
        working-directory: extractor/build
        run: |
          cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DZLIB_USE_STATIC_LIBS=ON -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build . -j"$(nproc)"
      - name: Package AppImage
        working-directory: extractor/build
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: bash lpack
      - uses: actions/upload-artifact@v4
        with:
          name: depkg-linux
          path: |
            extractor/build/depkg
            extractor/build/depkg.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: make
          pacboy: clang:p cmake:p ninja:p zlib:p
      - name: Build CryptoPP
        run: |
          make -C externals/cryptopp CXX=clang++ -j"$(nproc)" libcryptopp.a
          mkdir -p extractor/build/cryptopp/cryptopp
          cp externals/cryptopp/libcryptopp.a extractor/build/cryptopp/cryptopp/
      - name: Build depkg
        working-directory: extractor/build
        run: |
          cmake .. -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DZLIB_USE_STATIC_LIBS=ON -DCMAKE_EXE_LINKER_FLAGS=-static
          cmake --build .
          strip -s depkg.exe
      - uses: actions/upload-artifact@v4
        with:
          name: depkg-windows
          path: extractor/build/depkg.exe
          if-no-files-found: error
